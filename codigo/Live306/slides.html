<h1 id="sem-flame">Sem flame!</h1>
<p>Essa live pode levar a discussões teóricas por diferentes correntes de pensamentos em programação. Principalmente em relação a técnicas.</p>
<p>Quero que pensemos em python como uma linguagem dinâmica em runtime, com suporte a tipagem gradual, multi-paradigma e também em uma corrente de pensamento <a href="https://cs.brown.edu/~sk/Publications/Papers/Published/sk-teach-pl-post-linnaean/paper.pdf">pós lineu</a>.</p>
<p>Vamos tentar espremer a linguagem, sem pensar em técnicas de correntes específicas.</p>
<p>O que quer dizer sem dogmatismo de OOP/Funcional/Tipagem estática/... Sem agradar livros de engenharia.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="3" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="6" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="design-de-c%C3%B3digo">Design de código</h1>
<p>Uma definição:</p>
<blockquote>
<p><code>O design é definido tanto como &quot;o processo de definir a arquitetura, os componentes, as interfaces e outras características de um sistema ou componente&quot; quanto como &quot;o resultado desse processo&quot;.</code></p>
</blockquote>
<blockquote>
<p>BOURQUE, Pierre; FAIRLEY, R. E. (ORGS.). SWEBOK: guide to the software engineering body of knowledge. Version 3.0 ed. Los Alamitos, CA: IEEE Computer Society, 2014.</p>
</blockquote>
<p>Outra que eu gosto:</p>
<blockquote>
<p><code>O processo de design de sistemas aloca os requisitos a sistemas de hardware ou software. Ele estabelece uma arquitetura geral do sistema. O projeto de software envolve a identificação e a descrição das abstrações fundamentais do sistema de software e seus relacionamentos.</code></p>
</blockquote>
<blockquote>
<p>SOMMERVILLE, Ian. Software engineering. Tenth edition ed. Pearson, 2016.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="7" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="defini%C3%A7%C3%B5es">Definições</h1>
<p>Uma outra boa:</p>
<blockquote>
<p><code>Testar antes (TDD) também é uma técnica de design. (...) Isso é design lógico, ou de interface — exatamente como meus antigos livros da faculdade explicavam. Claro, esses livros nunca explicavam como fazer design lógico; eles apenas deixavam claro que ele precisava ser feito, e que precisava ser feito antes do design físico e da implementação, e que Deus ajude quem confundisse as duas coisas.</code></p>
</blockquote>
<blockquote>
<p>BECK, K. Aim, fire. IEEE Software, v. 18, n. 5, p. 87–89, set. 2001.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="8" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="um-cen%C3%A1rio-l%C3%BAdico">Um cenário lúdico</h1>
<p>Imagine que temos que ligar o cooler do nosso PC quando temperatura do processador for maior que <code>TEMPERATURA_LIMITE</code> e registrar essas alterações junto da temperatura atual.</p>
<p>Temos que:</p>
<ol>
<li>Saber a temperatura atual do processador</li>
<li>Checar se a temperatura atual exige que cooler seja ligado</li>
<li>Logar se o cooler será ligado ou desligado e qual a temperatura atual</li>
<li>Retornar se deve ligar ou desligar</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="9" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="pensando-em-c%C3%B3digo">Pensando em código</h1>
<p>O que nos daria algo como isso (ex_00.py):</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>() -&gt; <span class="hljs-built_in">bool</span>:
    temp_atual = psutil.sensors_temperatures()[<span class="hljs-string">&#x27;coretemp&#x27;</span>][<span class="hljs-number">0</span>].current <span class="hljs-comment">#???</span>

    <span class="hljs-keyword">if</span> temp_atual &gt;= TEMPERATURA_LIMITE:                   <span class="hljs-comment"># ???</span>
        logger.info(<span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temp_atual}</span>&#x27;</span>)  <span class="hljs-comment"># ???</span>
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">f&#x27;Cooler desligado |  TEMP <span class="hljs-subst">{temp_atual}</span>&#x27;</span>)  <span class="hljs-comment"># ???</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
<p>Aqui vemos um caso clássico de um <strong>mar de dependências</strong> que ao primeiro momento parecem inofensivas.</p>
<blockquote>
<p><code>pip install psutil</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="10" data-class="red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="red" style="--class:red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="olhando-com-aten%C3%A7%C3%A3o">Olhando com atenção</h1>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>() -&gt; <span class="hljs-built_in">bool</span>:
    temp_atual = psutil.sensors_temperatures()[<span class="hljs-string">&#x27;coretemp&#x27;</span>][<span class="hljs-number">0</span>].current <span class="hljs-comment">#???</span>

    <span class="hljs-keyword">if</span> temp_atual &gt;= TEMPERATURA_LIMITE:                   <span class="hljs-comment"># ???</span>
        logger.info(<span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temp_atual}</span>&#x27;</span>)  <span class="hljs-comment"># ???</span>
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">f&#x27;Cooler desligado |  TEMP <span class="hljs-subst">{temp_atual}</span>&#x27;</span>)  <span class="hljs-comment"># ???</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
<div class="mermaid">
graph TD
    A[ligar_cooler] --funcional--&gt; B[temp_atual]
    A --config--&gt; C[TEMPERATURA_LIMITE]
    A --&gt; D[logger]
    B --&gt; A
    C --&gt; A
    D --Effeito colateral--&gt; A
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="11" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="dando-nomes">Dando nomes</h1>
<p>Definições informais...</p>
<h2 id="depend%C3%AAncia">Dependência</h2>
<p>A dependência é uma relação entre partes do código onde uma não pode funcionar sem a outra. Em um cenário de dependência, um módulo ou função depende diretamente de outro para executar seu comportamento.</p>
<h2 id="acomplamento">Acomplamento</h2>
<p>O acoplamento mede o grau de dependência entre as partes do código. Quanto maior for o acoplamento, mais difícil será alterar ou manter o código, já que mudanças em uma parte podem afetar outras.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="12" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="depend%C3%AAncia--acoplamento">Dependência / Acoplamento</h1>
<p>Aqui vemos um caso clássico de um <em>mar</em> de dependências que ao primeiro momento parecem inofensivas:</p>
<ol>
<li>A função <code>ligar_cooler</code> depende de <code>psutil</code> para ser executada.</li>
<li>O corpo dela ainda depende do retorno de <code>psutil</code> para decidir em qual <em>branch</em> de código vai entrar.</li>
<li><code>TEMPERATURA_LIMITE</code> é uma constante que não conhecemos dentro do escopo</li>
<li><code>logger</code> não muda a lógica de resposta de <code>ligar_cooler</code>, mas pode gerar efeitos colaterais visíveis nos testes (stdout, arquivos de log), e testes podem precisar capturar ou ignorar isso.</li>
</ol>
<p>Ou seja, para ser executada ela tem diversas dependências de coisas que não fazem parte do seu escopo e ela não tem nenhum conhecimento.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="13" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="os-testes-como-design">Os testes como design</h1>
<p><code>ligar_cooler</code> é idiomaticamente simples, correta, fácil de ler. E, claro..., simples de testar!</p>
<p>O que esperaríamos que fosse um teste <em>AAA</em> simples, como:</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">test_ligar_cooler</span>():
    expected_result = <span class="hljs-literal">True</span>            <span class="hljs-comment"># Arrange</span>
    result = ligar_cooler()           <span class="hljs-comment"># Act - Chama o SUT</span>
    <span class="hljs-keyword">assert</span> expected_result == result  <span class="hljs-comment"># Assert</span>
</code></pre>
<p>O problema é que o teste passa a depender de estado externo e perde determinismo. Muitas coisas &quot;interferem&quot; no estado final do cooler.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="14" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="uma-nota-b%C3%A1sica---sutaaa">Uma nota básica... - SUT/AAA</h1>
<p>Partindo de uma premissa que temos que escrever testes, temos sempre algo a ser testado, um <a href="http://xunitpatterns.com/SUT.html">SUT (System Under Test)</a>.</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">xpto</span>():  <span class="hljs-comment"># Função pura</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">42</span>
</code></pre>
<p>Para testarmos isso, existe um pequeno padrão. O AAA (Arrange-Act-Assert):</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">test_xpto</span>():
    expected_result = <span class="hljs-number">24</span>  <span class="hljs-comment"># Arrange / Falha proposital</span>

    result = xpto()  <span class="hljs-comment"># Act</span>

    <span class="hljs-keyword">assert</span> result == expected_result  <span class="hljs-comment"># Assert</span>
</code></pre>
<p>Esse é o cenário ideal, perfeito, <em>by the book</em> dos testes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="15" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="embora-passe">Embora passe</h1>
<p><code>pytest -v &lt;test&gt;</code>: incrivelmente, &quot;o teste passa&quot; dessa forma. O fato de não conseguirmos cobrir 100% dele é somente um detalhe... Não dizem que 100% de cobertura é um mito?</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">test_ligar_cooler</span>():
    expected_result = <span class="hljs-literal">True</span>
    result = ligar_cooler()
    <span class="hljs-keyword">assert</span> expected_result == result
</code></pre>
<p>Se baseia em diversas premissas falsas:</p>
<ul>
<li><code>TEMPERATURA_LIMITE</code> sempre será <code>40</code>;</li>
<li><code>temp_atual</code> é sempre maior que <code>40</code></li>
</ul>
<p>Bom... Observações feitas, vamos começar a pensar um pouco sobre esse código e suas interações com coisas de fora da função.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="16" data-marpit-scope-9NzY1GuT="" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="acoplamento">Acoplamento</h1>
<p>Todas essas coisas trabalham cordenadamente para produzir o comportamento correto. Mas temos muitas coisas acopladas:</p>
<div class="mermaid">
flowchart TD
    ligar_cooler --&gt; psutil
    ligar_cooler --&gt; TEMPERATURA_LIMITE
    ligar_cooler --&gt; logger
</div>
<ul>
<li>Acoplamento funcional: <code>ligar_cooler</code> precisa do valor retornado pelo <code>psutil</code></li>
<li>Acoplamento de configuração: a função depende de <code>TEMPERATURA_LIMITE</code>.</li>
<li>Acoplamento de infra: <code>logger</code> vai gerar side effects malucos</li>
</ul>
<p>O problema de alto acoplamento é que ele reduz a testabilidade e aumenta o risco de bugs quando o sistema cresce, porque qualquer mudança em uma dependência pode quebrar o SUT.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="17" data-class="s-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="s-yellow" style="--class:s-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h2 id="design-%C3%A9">Design é</h2>
<h1 id="depende">DEPENDE</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="18" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="a-solu%C3%A7%C3%A3o-de-design-%C3%A9-depende">A solução de design é &quot;depende&quot;</h1>
<p>Aqui agora vão brotar teorias de todos os lados, sério... as pessoas têm MUITAS opiniões. E cada uma delas vai ter seus ônus e seus bônus...</p>
<ul>
<li>SoC / Desacoplar</li>
<li>Injetar</li>
<li>Patching</li>
<li>Inverter o controle
<ul>
<li>Usar containers</li>
</ul>
</li>
<li>...</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="19" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="soc-ex_01py">SoC [ex_01.py]</h1>
<p>Vamos começar com o problema básico do <code>psutil</code> e vamos nos aprofundando nos próximos depois.</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">cpu_temp</span>() -&gt; <span class="hljs-built_in">float</span>:
    <span class="hljs-keyword">return</span> psutil.sensors_temperatures()[<span class="hljs-string">&#x27;coretemp&#x27;</span>][<span class="hljs-number">0</span>].current


<span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>() -&gt; <span class="hljs-built_in">bool</span>:
    temp_atual = cpu_temp()
    <span class="hljs-comment"># ...</span>
</code></pre>
<p>Vamos separar a preocupação (<a href="https://en.wikipedia.org/wiki/Separation_of_concerns">SoC</a>) dos erros do <code>psutil</code>. Ali podem ocorrer uma soma de inúmeros problemas envolvendo SOs (alguns não têm essa implementação) e Sensores (às vezes não tem driver).</p>
<blockquote>
<p>Mas não é nosso objetivo aqui, então... pulamos!</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="20" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="a-solu%C3%A7%C3%A3o-mais-simples-par%C3%A2metros-ex_02py">A solução mais simples, parâmetros [ex_02.py]</h1>
<p>Quando pensamos um pouco além no design da aplicação.</p>
<p>Uma forma de conseguir testar isso, seria fazer com que <code>ligar_cooler</code> somente receba o valor de <code>cpu_temp</code>. Sem a necessidade explícita de acoplar o comportamento em seu corpo:</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>(<span class="hljs-params">temperatura_atual: <span class="hljs-built_in">float</span></span>) -&gt; <span class="hljs-built_in">bool</span>:
    <span class="hljs-keyword">if</span> temperatura_atual &gt;= TEMPERATURA_LIMITE:
        logger.info(<span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">f&#x27;Cooler desligado |  TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="21" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="a-solu%C3%A7%C3%A3o-mais-simples-par%C3%A2metros-ex_02py-1">A solução mais simples, parâmetros [ex_02.py]</h1>
<p>O que poderia fazer o teste ser estupidamente simples:</p>
<pre><code class="language-python"><span class="hljs-meta">@pytest.mark.parametrize(<span class="hljs-params">  <span class="hljs-comment"># Arrange</span>
    (<span class="hljs-params"><span class="hljs-string">&#x27;temp&#x27;</span>, <span class="hljs-string">&#x27;expected_result&#x27;</span></span>),
    [(<span class="hljs-params"><span class="hljs-number">30</span>, <span class="hljs-literal">False</span></span>), (<span class="hljs-params"><span class="hljs-number">50</span>, <span class="hljs-literal">True</span></span>)],
    ids=[<span class="hljs-string">&#x27;Temperatura baixa&#x27;</span>, <span class="hljs-string">&#x27;Temperatura alta&#x27;</span>]
</span>)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">test_ligar_cooler</span>(<span class="hljs-params">temp, expected_result</span>):
    result = ligar_cooler(temp)       <span class="hljs-comment"># Act</span>
    <span class="hljs-keyword">assert</span> expected_result == result  <span class="hljs-comment"># Assert</span>
</code></pre>
<p>Cobrindo ambos os casos. Tanto para ligar o cooler, quanto para não ligar! Isso é ótimo, não?</p>
<p>Agora a função tira de dentro dela a caixa preta que vinha com <code>cpu_temp</code>. A testabilidade aqui fica bastante atraente.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="22" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="%E2%9A%A0%EF%B8%8F-shift"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> Shift</h1>
<p>Embora pareça ótimo, isso tem uma pegadinha grande. Porque, de forma geral, só estamos movendo a &quot;ruim de testar&quot; para outro lugar.</p>
<p>No final das contas, para executar seu código, como ele não tem mais a dependência, ela vai aparecer de outra forma e em outro lugar:</p>
<pre><code class="language-python"><span class="hljs-keyword">if</span> __name__ == <span class="hljs-string">&#x27;__main__&#x27;</span>:
    temp = cpu_temp()
    ligar_cooler(temp)
</code></pre>
<p>O que parecia bom, na verdade, é alguns chamam de &quot;shift do problema&quot;. A dependência não foi removida, mas o local de resolução é alterado.</p>
<p>Mas, talvez exista uma forma diferente de resolver isso sem criar uma <strong>dependência temporal</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="23" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="inje%C3%A7%C3%A3o-de-depend%C3%AAncia-ex_03py">Injeção de dependência [ex_03.py]</h1>
<p>Outra forma de resolver esse problema, baseado que temos HOFs (Funções de ordem superior) é usar a própria função como argumento.</p>
<p>O que continuaria fácil de testar e não levaria a complexidade para outro lugar do código:</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>(<span class="hljs-params">cpu_temp_fn: <span class="hljs-type">Callable</span>[[], <span class="hljs-built_in">float</span>] = cpu_temp</span>) -&gt; <span class="hljs-built_in">bool</span>:
    temperatura_atual = cpu_temp_fn()

    <span class="hljs-keyword">if</span> temperatura_atual &gt;= TEMPERATURA_LIMITE:
        logger.info(<span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">f&#x27;Cooler desligado |  TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="24" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="inje%C3%A7%C3%A3o-de-depend%C3%AAncia-ex_03py-1">Injeção de dependência [ex_03.py]</h1>
<p>O que nos daria um teste parecido com esse:</p>
<pre><code class="language-python"><span class="hljs-meta">@pytest.mark.parametrize(<span class="hljs-params">
    (<span class="hljs-params"><span class="hljs-string">&#x27;func&#x27;</span>, <span class="hljs-string">&#x27;expected&#x27;</span></span>),
    [(<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">30</span>, <span class="hljs-literal">False</span></span>), (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">50</span>, <span class="hljs-literal">True</span></span>)],
    ids=[<span class="hljs-string">&#x27;Temperatura baixa&#x27;</span>, <span class="hljs-string">&#x27;Temperatura alta&#x27;</span>]
</span>)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">test_ligar_cooler</span>(<span class="hljs-params">func, expected</span>):
    result = ligar_cooler(func)
    <span class="hljs-keyword">assert</span> expected == result
</code></pre>
<p>Aqui temos uma qualidade interessante, não fizemos o shift para o main, a responsabilidade de execução continua em <code>ligar_cooler</code>, mas a função pode seguir de forma fluída.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="25" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="%E2%9A%A0%EF%B8%8F-ponto-de-aten%C3%A7%C3%A3o"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> ponto de atenção</h1>
<p>Talvez um ponto de atenção que deve ser considerado nessa técnica é que a resolução dos argumentos default do python é feita no momento em que a função é definida, o que pode oferecer alguns problemas a depender dos testes que serão feitos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="26" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="monkey-patch-ex_04py">Monkey-patch [ex_04.py]</h1>
<p>Outra solução prática e muito comum, que gera menos &quot;tensão&quot; com o código original é fazer o <em>patch</em>, estamos numa linguagem dinâmica, isso não é ruim...</p>
<p>O pytest tem um fixture para isso chamada <code>monkeypatch</code>. Ficando assim:</p>
<pre><code class="language-python"><span class="hljs-meta">@pytest.mark.parametrize(<span class="hljs-params">
    (<span class="hljs-params"><span class="hljs-string">&#x27;func&#x27;</span>, <span class="hljs-string">&#x27;expected&#x27;</span></span>),
    [(<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">30</span>, <span class="hljs-literal">False</span></span>), (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">50</span>, <span class="hljs-literal">True</span></span>)],
    ids=[<span class="hljs-string">&#x27;Temperatura baixa&#x27;</span>, <span class="hljs-string">&#x27;Temperatura alta&#x27;</span>]
</span>)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">test_ligar_cooler</span>(<span class="hljs-params">monkeypatch, func, expected</span>):
    monkeypatch.<span class="hljs-built_in">setattr</span>(<span class="hljs-string">&#x27;exemplo_cooler.cpu_temp&#x27;</span>, func)

    result = ligar_cooler()
    <span class="hljs-keyword">assert</span> expected == result
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="27" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="monkey-patch-ex_04py-1">Monkey-patch [ex_04.py]</h1>
<p>Dessa forma, não temos que alterar o código e ainda assim conseguimos testar ambas as <em>branches</em>. Python é realmente divertido... :)</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>() -&gt; <span class="hljs-built_in">bool</span>:
    temperatura_atual = cpu_temp()

    <span class="hljs-keyword">if</span> temperatura_atual &gt;= TEMPERATURA_LIMITE:
        logger.info(<span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">f&#x27;Cooler desligado |  TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> O ponto de atenção é que a resolução do patch é acoplada estruturalmente ao nome do <code>módulo.função</code>, caso isso seja alterado, o teste pode não apresentar o resultado esperado.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="28" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="recapitulando-aqui">Recapitulando aqui</h1>
<p>Todas as técnicas são igualmente válidas, tendem a funcionar extremamente bem. Mas você ainda quer saber qual é a melhor... Bom... <strong>depende</strong>...</p>
<ol>
<li>Passar o valor exigirá que a DOC só suma, mas tenha que ser testado em outro lugar;</li>
<li>Usar DI facilita bastante as chamadas, mas imagine isso com mais dependências;</li>
<li>Monkey-patch depende exatamente de como o módulo está, se algo mudar, como algum nome, falhará.</li>
</ol>
<p>Conhecer as técnicas é mais benéfico do que pensar em qual é a melhor... <strong>O design real depende do contexto, do domínio e da equipe</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="29" data-class="s-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="s-yellow" style="--class:s-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h2 id="vadiando-o-problema">Vadiando o problema</h2>
<h1 id="pera-ebrconstantebrlogging">Pera! E...<br />Constante?<br />Logging?</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="30" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="e-a-constante">E a constante?</h1>
<p>Bom, agora você está com as técnicas em mente, vamos refletir um pouco sobre o problema da constante <code>TEMPERATURA_LIMITE</code>.</p>
<p>Para o nosso problema de fato ela é só um valor fixo. O que significa que as técnicas que usamos até agora seriam o suficiente. Mas isso não quer dizer que ela por definição não seja um erro de design.</p>
<p>Vendo isso de uma ótica mais realista, a constante pode não ser necessariamente um valor fixo. Pensando em domínio, cada processador teria uma temperatura pertinente para ser refrigerado. O que varia com que ela fosse algo que varia, mas é constante por execução. Talvez uma variável de ambiente?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="31" data-class="yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="yellow" style="--class:yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="e-a-constante-ex_05py">E a constante? [ex_05.py]</h1>
<p>Algo como isso:</p>
<pre><code class="language-python"><span class="hljs-keyword">from</span> os <span class="hljs-keyword">import</span> environ

TEMPERATURA_LIMITE = <span class="hljs-built_in">int</span>(environ.get(<span class="hljs-string">&#x27;TEMPERATURA_LIMITE&#x27;</span>, <span class="hljs-string">&#x27;40&#x27;</span>))
</code></pre>
<p>Agora nossos testes deixam de ser determinísticos. Dependendo do valor setado, os testes passam ou não...</p>
<pre><code class="language-bash">TEMPERATURA_LIMITE=100 pytest tests_cooler.py -v
======================= <span class="hljs-built_in">test</span> session starts =======================
tests_cooler.py::test_ligar_cooler[Temperatura baixa] PASSED     [ 50%]
tests_cooler.py::test_ligar_cooler[Temperatura alta] FAILED      [100%]

TEMPERATURA_LIMITE=40 pytest tests_cooler.py -v
======================= <span class="hljs-built_in">test</span> session starts =======================
tests_cooler.py::test_ligar_cooler[Temperatura baixa] PASSED     [ 50%]
tests_cooler.py::test_ligar_cooler[Temperatura alta] PASSED      [100%]
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="32" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="misturando-t%C3%A9cnicas-ex_05py">Misturando técnicas [ex_05.py]</h1>
<p>Conforme você olha o problema por óticas diferentes, podemos chegar a soluções bastante contundentes.</p>
<p>Se fossemos usar a técnica de <strong>passagem de valores</strong> para constante, teríamos algo como:</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>(<span class="hljs-params">
    cpu_temp_fn: <span class="hljs-type">Callable</span>[[], <span class="hljs-built_in">float</span>] = cpu_temp,  <span class="hljs-comment"># DI</span>
    max_temp: <span class="hljs-built_in">int</span> = TEMPERATURA_LIMITE,           <span class="hljs-comment"># Passagem de valores</span>
</span>) -&gt; <span class="hljs-built_in">bool</span>:
    temperatura_atual = cpu_temp_fn()
    <span class="hljs-keyword">if</span> temperatura_atual &gt;= max_temp:
        logger.info(<span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">f&#x27;Cooler desligado |  TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="33" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="misturando-t%C3%A9cnicas">Misturando técnicas</h1>
<p>Tendo testes parecidos com esse:</p>
<pre><code class="language-python"><span class="hljs-meta">@pytest.mark.parametrize(<span class="hljs-params">
    (<span class="hljs-params"><span class="hljs-string">&#x27;func&#x27;</span>, <span class="hljs-string">&#x27;limit&#x27;</span>, <span class="hljs-string">&#x27;expected&#x27;</span></span>),
    [
        (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">30</span>, <span class="hljs-number">40</span>, <span class="hljs-literal">False</span></span>),
        (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">30</span>, <span class="hljs-number">20</span>, <span class="hljs-literal">False</span></span>),
        (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">50</span>, <span class="hljs-number">40</span>, <span class="hljs-literal">True</span></span>),
    ],
</span>)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">test_ligar_cooler</span>(<span class="hljs-params">func, limit, expected</span>):
    result = ligar_cooler(func, limit)
    <span class="hljs-keyword">assert</span> expected == result
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="34" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="misturando-t%C3%A9cnicas-1">Misturando técnicas</h1>
<p>E é aqui que mora o pragmatismo da coisa, as técnicas não são excludentes. O grande ponto, pelo menos para mim, é que embora adicionar mais parâmetros pode tender a deixar a função mais &quot;pura&quot;, depender que todos os parâmetros sejam passados, pode gerar efeitos indesejados na nossa API.</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>(<span class="hljs-params">cpu_temp_fn: <span class="hljs-type">Callable</span>[[], <span class="hljs-built_in">float</span>] = cpu_temp</span>) -&gt; <span class="hljs-built_in">bool</span>:
    temperatura_atual = cpu_temp_fn()

    <span class="hljs-keyword">if</span> temperatura_atual &gt;= TEMPERATURA_LIMITE:
        logger.info(<span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">f&#x27;Cooler desligado |  TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
<p>Que tal juntar DI com patch?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="35" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="di--patch-de-env-ex_06py">DI + Patch de env [ex_06.py]</h1>
<p>Ficaria +- assim:</p>
<pre><code class="language-python"><span class="hljs-meta">@pytest.mark.parametrize(<span class="hljs-params">
    (<span class="hljs-params"><span class="hljs-string">&#x27;func&#x27;</span>, <span class="hljs-string">&#x27;limit&#x27;</span>, <span class="hljs-string">&#x27;expected&#x27;</span></span>),
    [
        (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">30</span>, <span class="hljs-string">&#x27;40&#x27;</span>, <span class="hljs-literal">False</span></span>),
        (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">30</span>, <span class="hljs-string">&#x27;20&#x27;</span>, <span class="hljs-literal">False</span></span>),
        (<span class="hljs-params"><span class="hljs-keyword">lambda</span>: <span class="hljs-number">50</span>, <span class="hljs-string">&#x27;40&#x27;</span>, <span class="hljs-literal">True</span></span>),
    ],
</span>)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">test_ligar_cooler</span>(<span class="hljs-params">monkeypatch, func, limit, expected</span>):
    <span class="hljs-comment"># Aqui alteramos a veriável de ambiente</span>
    monkeypatch.setenv(<span class="hljs-string">&#x27;TEMPERATURA_LIMITE&#x27;</span>, limit)

    result = ligar_cooler(func)
    <span class="hljs-keyword">assert</span> expected == result
</code></pre>
<blockquote>
<p>API pública: <code>def ligar_cooler(cpu_temp_fn = cpu_temp)</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="36" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="mas-por-qu%C3%AA">Mas por quê?</h1>
<p>Porque nem toda dependência tem o mesmo peso conceitual.</p>
<ul>
<li><code>cpu_temp</code> é uma <strong>colaboração comportamental</strong>:  Ela executa algo. Ela decide algo. Ela é dinâmica.</li>
<li><code>TEMPERATURA_LIMITE</code> é <strong>configuração</strong>: Ela representa um valor de ambiente. Ela é estática durante a execução.</li>
</ul>
<p>Misturar ambas como se fossem iguais é o que geralmente confunde decisões de design.</p>
<p>Quando us DI para o invocável (<code>cpu_temp_fn</code>), eu estou tornando explícita uma colaboração.</p>
<p>Estou dizendo:</p>
<blockquote>
<p>Essa função depende de alguém que saiba ler a temperatura.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="37" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="comportamento--contrato">Comportamento / Contrato</h1>
<p>Isso é parte do comportamento.</p>
<p>Mas quando faço patch da constante, eu estou lidando com <strong>estado de ambiente</strong>, não com colaboração.</p>
<p>Transformar toda configuração em parâmetro pode deixar a função mais pura, ao mesmo tempo que  também pode transformar a assinatura em algo que não representa mais o domínio.</p>
<p><strong>Nem toda dependência merece virar contrato público na API.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="38" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="o-que-cada-coisa-exatamente-%C3%A9">O que cada coisa exatamente é?</h1>
<p>O ponto importante aqui não é decorar a tabela:</p>
<table>
<thead>
<tr>
<th>Exemplo</th>
<th>Problema típico</th>
<th>Para ler depois</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>cpu_temp()</code></td>
<td>Não determinismo</td>
<td>Collaborator / DOC</td>
</tr>
<tr>
<td><code>TEMPERATURA_LIMITE</code></td>
<td>Estado global</td>
<td>Global State</td>
</tr>
<tr>
<td>Sensor real, <code>psutil</code></td>
<td>Dependência externa</td>
<td>External Resource</td>
</tr>
<tr>
<td><code>logger.info()</code></td>
<td>Observabilidade</td>
<td>Side Effect</td>
</tr>
<tr>
<td><code>'exemplo_cooler.cpu_temp'</code></td>
<td>Fragilidade de patch</td>
<td>Static Coupling</td>
</tr>
</tbody>
</table>
<p>É perceber que:</p>
<blockquote>
<p>Técnicas diferentes resolvem categorias diferentes de dependência. Às vezes de forma mais simples, às vezes de forma mais complexa.</p>
</blockquote>
<p>Quando a gente trata tudo como &quot;o mesmo tipo de dependência&quot;, começa a tomar decisões exageradas. Que refletem diretamente no design do código.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="39" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="mas-e-os-logs">Mas e os logs?</h1>
<p>Até agora deixamos o logger ali, meio inocente. Mas e se quisermos testar que o log foi emitido?</p>
<p>Não precisamos transformar tudo em dependência explícita, muito menos criar um container maluco.</p>
<p>O próprio pytest já nos dá ferramentas para lidar com esse tipo de efeito colateral.</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">test_log_quando_liga</span>(<span class="hljs-params">caplog, monkeypatch</span>):
    caplog.set_level(DEBUG)
    monkeypatch.setenv(<span class="hljs-string">&#x27;TEMPERATURA_LIMITE&#x27;</span>, <span class="hljs-string">&#x27;5&#x27;</span>)
    
    ligar_cooler(<span class="hljs-keyword">lambda</span>: <span class="hljs-number">10</span>)

    <span class="hljs-keyword">assert</span> <span class="hljs-string">&#x27;Cooler desligado&#x27;</span> <span class="hljs-keyword">in</span> caplog.text
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="40" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="pensando-pensamentos">Pensando pensamentos...</h1>

<p>Aqui não precisei:</p>
<ul>
<li>Tornar o logger parâmetro</li>
<li>Criar interface</li>
<li>Tornar tudo puro</li>
</ul>
<p>Usamos a ferramenta certa para o tipo certo de dependência.</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">test_log_quando_liga</span>(<span class="hljs-params">monkeypatch, caplog</span>):
    monkeypatch.setenv(<span class="hljs-string">&#x27;TEMPERATURA_LIMITE&#x27;</span>, <span class="hljs-number">5</span>)
    
    ligar_cooler(<span class="hljs-keyword">lambda</span>: <span class="hljs-number">10</span>)

    <span class="hljs-keyword">assert</span> <span class="hljs-string">&quot;Cooler ligado&quot;</span> <span class="hljs-keyword">in</span> caplog.text
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="41" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="pureza-%C3%A9-sobre-isso-ex_08py">Pureza, é sobre isso... [ex_08.py]</h1>
<p>Vamos partir de um experimento levado ao absurdo. Vamos imaginar que removemos todas as dependências externas em uma função pura. Ela não sofre / nem gera nenhum side effect.</p>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>(<span class="hljs-params">  <span class="hljs-comment"># Passagem de valores</span>
    cpu_temp: <span class="hljs-built_in">float</span>,
    max_temp: <span class="hljs-built_in">int</span> = TEMPERATURA_LIMITE,
    logger: Logger = logger,
</span>) -&gt; <span class="hljs-built_in">bool</span>:
    <span class="hljs-keyword">if</span> cpu_temp &gt;= max_temp:
        logger.info(<span class="hljs-string">&quot;Cooler ligado&quot;</span>)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    logger.info(<span class="hljs-string">&quot;Cooler desligado&quot;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
<p>Determinística, pura, sem efeitos colaterais, trivial de testar</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="42" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="pureza-ao-extremo">Pureza ao extremo</h1>
<p>É tudo que o SUT precisa, não? Olha esse teste:</p>
<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Logger</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-variable language_">self</span>.messages = []

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">info</span>(<span class="hljs-params">self, message</span>):
        <span class="hljs-variable language_">self</span>.messages.append(message)

<span class="hljs-meta">@pytest.mark.parametrize(<span class="hljs-params">
    (<span class="hljs-params"><span class="hljs-string">&#x27;temp&#x27;</span>, <span class="hljs-string">&#x27;max_temp&#x27;</span>, <span class="hljs-string">&#x27;msg&#x27;</span>, <span class="hljs-string">&#x27;expected&#x27;</span></span>),
    [(<span class="hljs-params"><span class="hljs-number">30</span>, <span class="hljs-number">40</span>, <span class="hljs-string">&#x27;Cooler desligado&#x27;</span>, <span class="hljs-literal">False</span></span>), (<span class="hljs-params"><span class="hljs-number">50</span>, <span class="hljs-number">40</span>, <span class="hljs-string">&#x27;Cooler ligado&#x27;</span>, <span class="hljs-literal">True</span></span>)]
</span>)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">test_decidir_estado_cooler</span>(<span class="hljs-params">temp, max_temp, msg, expected</span>):
    logger = Logger()

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="43" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="pensando-pensamentos-1">Pensando pensamentos</h1>
<p>Perfeito.</p>
<p>Mas as perguntas chegam...:</p>
<ul>
<li>Quem cria tudo isso?</li>
<li>Quem passa essas dependências?</li>
<li>A API pública precisa mesmo disso tudo?</li>
</ul>
<p>Se o sistema começa a crescer, a composição começa a ficar espalhada.</p>
<p>É aqui que entra o conceito original de Inversão de Controle.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="44" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="containers-e-invers%C3%A3o-de-controle-ioc">Containers e Inversão de Controle (IoC)</h1>
<p>Inversão de Controle significa basicamente:</p>
<p><strong>Quem usa uma dependência não é quem a cria.</strong></p>
<p>Nada místico, nada mágico, nada de framework. Só isso. Podemos modelar a forma mais simples possível de um &quot;container&quot;:</p>
<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Container</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-variable language_">self</span>._services = {}

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">register</span>(<span class="hljs-params">self, name, dependency</span>):
        <span class="hljs-variable language_">self</span>._services[name] = dependency

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__getattr__</span>(<span class="hljs-params">self, name</span>):
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>._services[name]
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="45" data-class="d-yellow" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-yellow" style="--class:d-yellow;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="ioc-ex_09py">IoC [ex_09.py]</h1>
<p>E usar assim:</p>
<pre><code class="language-python">container = Container()
container.register(<span class="hljs-string">&#x27;cpu_reader&#x27;</span>, cpu_temp)
container.register(<span class="hljs-string">&#x27;max_temp&#x27;</span>, <span class="hljs-number">40</span>)
container.register(<span class="hljs-string">&#x27;logger&#x27;</span>, logger)

<span class="hljs-keyword">def</span> <span class="hljs-title function_">ligar_cooler</span>(<span class="hljs-params">container: Container</span>) -&gt; <span class="hljs-built_in">bool</span>:
    <span class="hljs-keyword">if</span> container.cpu_reader() &gt;= container.max_temp:
        container.logger.info(
            <span class="hljs-string">f&#x27;Cooler ligado | TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>
        )
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>

    container.logger.info(
        <span class="hljs-string">f&#x27;Cooler desligado | TEMP <span class="hljs-subst">{temperatura_atual}</span>&#x27;</span>
    )
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="46" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="ioc">IoC</h1>
<p>Agora:</p>
<ul>
<li>A função não cria nada.</li>
<li>Ela apenas resolve dependências.</li>
<li>A composição está centralizada.</li>
</ul>
<p>Mas... isso melhorou o design? Ou só mudou o lugar da complexidade?</p>
<p>Introduzimos:</p>
<ul>
<li>indireção.</li>
<li>um ponto global implícito.</li>
<li>outra dependência: o próprio container.</li>
</ul>
<p>E para um exemplo simples como esse... talvez seja exagero. Me pergunto se existe realmente um caso, dado que é fácil contornar as coisas em python que isso realmente faça sentido...</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="47" data-class="d-red" data-theme="i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm" lang="en-US" class="d-red" style="--class:d-red;--theme:i8qb5m97rpe26uycoil7sdu6s5g67xk4qtrodfb1psm;">
<h1 id="conclus%C3%A3o">Conclusão</h1>
<p>Testabilidade é uma arte estranha que impacta diretamente o design do código. E o design, por sua vez também influencia como o código vai ser testado.</p>
<p>Como falamos no começo, Python é uma linguagem &quot;estranha&quot; do ponto de vista teórico. Muitas vezes, o que os livros de engenharia sugerem não se aplica tão bem aqui, por conta das características da linguagem, como a tipagem dinâmica e a flexibilidade de misturar paradigmas.</p>
<p>No fim das contas, isso torna o estudo da testabilidade e do design bem mais divertido, porque temos mais liberdade para experimentar e tomar decisões mais práticas, sem ficar preso a uma única teoria ou técnica.</p>
</section>
